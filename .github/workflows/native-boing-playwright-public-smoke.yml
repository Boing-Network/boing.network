name: native-boing-playwright-public-smoke

# Headless load of BOING_E2E_SWAP_URL (default boing.finance/swap). No extension; unattended.
# Does not run on every PR — avoids failing merges on transient site or CDN issues.
# See docs/PLAYWRIGHT-E2E-CI-OPS.md § D.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1"
  push:
    branches: [main]
    paths:
      - "examples/native-boing-playwright/tests/public-swap-page-smoke.spec.ts"
      - "examples/native-boing-playwright/tests/tutorial-readme-wiring.spec.ts"
      - "examples/native-boing-tutorial/README.md"
      - "examples/native-boing-playwright/playwright.config.ts"
      - "examples/native-boing-playwright/package.json"
      - "examples/native-boing-playwright/package-lock.json"
      - ".github/workflows/native-boing-playwright-public-smoke.yml"

permissions:
  contents: read

jobs:
  public-swap-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/native-boing-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/native-boing-playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run public swap page smoke
        env:
          # GitHub-hosted runners often get 403 from boing.finance/swap (WAF). The spec falls back to boing.network;
          # setting primary to the main site avoids an extra failed navigation in CI.
          BOING_E2E_SWAP_URL: https://boing.network/
        run: npm run test:e2e:public-smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-public-smoke-report
          path: |
            examples/native-boing-playwright/playwright-report
            examples/native-boing-playwright/test-results
