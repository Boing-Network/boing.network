name: Deploy docs.boing.network

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: cd docs-site && npm ci

      - name: Build
        run: cd docs-site && npm run build

      - name: Deploy to Cloudflare Pages
        run: |
          cd docs-site
          for i in 1 2 3; do
            npm exec wrangler -- pages deploy dist --project-name=boing-docs && exit 0
            echo "Deploy attempt $i failed (e.g. 504). Retrying in 30s..."
            sleep 30
          done
          echo "Deploy failed after 3 attempts."
          exit 1
        env:
          # CLOUDFLARE_API_TOKEN required. Account ID: repo Actions secret CLOUDFLARE_ACCOUNT_ID
          # (same account as website Pages). If unset, wrangler may still resolve from the token.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
