# Build boing and boing-node release binaries for testnet/mainnet distribution.
# Triggers on version tags (e.g. v0.1.0, testnet-v1). Upload artifacts; optionally create a GitHub Release.
name: Release binaries

on:
  push:
    tags:
      - 'v*'
      - 'testnet*'

# Default GITHUB_TOKEN is read-only in some orgs; releases require contents: write
# (otherwise softprops/action-gh-release gets HTTP 403 after successful builds).
permissions:
  contents: write

# One release at a time per tag ref; avoid overlapping multi-OS artifact
# uploads racing into the same GitHub Release (audit #61 item 75).
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: linux-x86_64
          - os: macos-14
            artifact_name: macos-aarch64
          - os: windows-latest
            artifact_name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch

      # Build only node + CLI; skip desktop-hub (Tauri/GTK) which CI runners do not provision.
      - name: Build release
        run: cargo build --release -p boing-node -p boing-cli

      - name: Prepare artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p artifacts
          cp target/release/boing artifacts/boing-${{ matrix.artifact_name }} 2>/dev/null || true
          cp target/release/boing-node artifacts/boing-node-${{ matrix.artifact_name }} 2>/dev/null || true
          cd artifacts && zip -r ../release-${{ matrix.artifact_name }}.zip . && cd ..

      - name: Prepare artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir artifacts
          copy target\release\boing.exe artifacts\boing-${{ matrix.artifact_name }}.exe
          copy target\release\boing-node.exe artifacts\boing-node-${{ matrix.artifact_name }}.exe
          Compress-Archive -Path artifacts\* -DestinationPath release-${{ matrix.artifact_name }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.artifact_name }}
          path: release-${{ matrix.artifact_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v1 = v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
          # Draft releases have no public /releases/download/... URLs — breaks the SHA refresh scripts and the node listing downloads.
          # Publish testnet tags immediately; keep `v*` as draft for manual review before mainnet drops.
          draft: ${{ !startsWith(github.ref_name, 'testnet') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
