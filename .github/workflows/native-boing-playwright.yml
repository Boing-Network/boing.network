name: native-boing-playwright

# Validates the Playwright package (install + test run). Tests skip without BOING_EXPRESS_EXTENSION_PATH (exit 0).
# Real headed + extension E2E needs a display and manual unlock — see docs/PLAYWRIGHT-E2E-CI-OPS.md and docs/TESTNET-RPC-INFRA.md §4.
on:
  push:
    branches: [main]
    paths:
      - "examples/native-boing-playwright/**"
      - "examples/native-boing-tutorial/README.md"
      - "examples/native-boing-tutorial/package.json"
      - ".github/workflows/native-boing-playwright.yml"
  pull_request:
    paths:
      - "examples/native-boing-playwright/**"
      - "examples/native-boing-tutorial/README.md"
      - "examples/native-boing-tutorial/package.json"
      - ".github/workflows/native-boing-playwright.yml"

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/native-boing-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/native-boing-playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright (skipped without extension path)
        run: npm run test:e2e

      - name: Tutorial README script wiring (offline)
        run: npx playwright test tests/tutorial-readme-wiring.spec.ts --project=public
