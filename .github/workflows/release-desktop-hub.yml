# Build and publish Boing Network Hub (Tauri 2 desktop app) for Windows, macOS, and Linux.
# Trigger: push tag desktop-hub/v* (e.g. desktop-hub/v0.1.2) or Run workflow from Actions.
# Does NOT run on push to main or on tags like v* or testnet* (those are for release.yml).
name: Desktop Hub — Release

on:
  push:
    tags:
      - 'desktop-hub/v*'
  workflow_dispatch:

permissions:
  contents: write

# Serialize releases so parallel tag builds cannot race when syncing
# website/public/hub-updater/latest.json onto main (audit #61 item 75).
concurrency:
  group: release-desktop-hub
  cancel-in-progress: false

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: |
            boing-sdk/package-lock.json
            desktop-hub/package-lock.json

      # file:../boing-sdk does not install the SDK's devDependencies (TypeScript), so `prepare` cannot run `tsc` there.
      # Build the SDK once before hub `npm ci` so `dist/` exists and no broken lifecycle runs on the link.
      - name: Build boing-sdk
        working-directory: boing-sdk
        run: npm ci && npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Workspace root contains desktop-hub/src-tauri; target is at repo root
          workspaces: '.'

      - name: Remove stale node_modules (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: desktop-hub
        shell: bash
        run: rm -rf node_modules

      - name: Install frontend dependencies
        working-directory: desktop-hub
        shell: bash
        run: npm ci

      - name: Import Windows code signing certificate
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Host 'Windows signing skipped: WINDOWS_CERTIFICATE or WINDOWS_CERTIFICATE_PASSWORD not set'
            exit 0
          }
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt -Force
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          Remove-Item -Recurse -Force certificate

      - name: Set Windows certificate thumbprint in config
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            Write-Host 'Windows signing thumbprint skipped: WINDOWS_CERTIFICATE_THUMBPRINT not set'
            exit 0
          }
          node -e "
          const fs = require('fs');
          const path = 'desktop-hub/src-tauri/tauri.conf.json';
          const c = JSON.parse(fs.readFileSync(path, 'utf8'));
          c.bundle.windows.certificateThumbprint = process.env.WINDOWS_CERTIFICATE_THUMBPRINT;
          fs.writeFileSync(path, JSON.stringify(c, null, 2));
          "
        working-directory: .

      # Minisign key: write to file (preserves newlines). Cannot use `secrets` in step `if:` (invalid workflow).
      # Optional password only appended to GITHUB_ENV when non-empty.
      - name: Configure Tauri updater signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          _PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${KEY}" ]; then
            echo "::error::Set repository secret TAURI_SIGNING_PRIVATE_KEY (full minisign private key, both lines)."
            exit 1
          fi
          mkdir -p desktop-hub/.tauri
          python -c "import os, pathlib; pathlib.Path('desktop-hub/.tauri/ci-updater.key').write_text(os.environ['KEY'], encoding='utf-8')"
          # Tauri reads TAURI_SIGNING_PRIVATE_KEY (path or inline key), not *_PATH.
          echo "TAURI_SIGNING_PRIVATE_KEY=${{ github.workspace }}/desktop-hub/.tauri/ci-updater.key" >> "$GITHUB_ENV"
          if [ -n "${_PW}" ]; then
            {
              echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<__TAURI_PW_EOF__'
              printf '%s' "${_PW}"
              echo ''
              echo '__TAURI_PW_EOF__'
            } >> "$GITHUB_ENV"
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-hub
          tagName: desktop-hub/v__VERSION__
          releaseName: 'Boing Network Hub v__VERSION__'
          releaseBody: 'All-in-one desktop app: Observer, Wallet, Finance, Testnet. Direct downloads at https://boing.network/downloads'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Copy signed latest.json to the website so the app can use a stable URL. GitHub's
  # /releases/latest/ points at the newest *any* release; this repo also ships node
  # binaries, so "latest" can drift away from desktop-hub and break auto-updates.
  sync-updater-manifest-to-website:
    name: Sync hub latest.json → website (boing.network/hub-updater)
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/desktop-hub/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download latest.json from this hub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p /tmp/hub-updater
          gh release download "$TAG" -R "${{ github.repository }}" -p latest.json -D /tmp/hub-updater
          test -s /tmp/hub-updater/latest.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Commit manifest for Cloudflare Pages
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p website/public/hub-updater
          cp /tmp/hub-updater/latest.json website/public/hub-updater/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/public/hub-updater/latest.json
          if git diff --staged --quiet; then
            echo "No changes to latest.json"
            exit 0
          fi
          git commit -m "chore(hub): sync updater manifest from ${TAG_NAME}"
          git pull --rebase origin main
          git push origin main
