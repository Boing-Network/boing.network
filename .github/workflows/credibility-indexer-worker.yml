# Deploy Cloudflare Worker `boing-credibility-indexer` (Testnet Passport stage 2; ticked every 15 min by boing-native-dex-indexer via service binding).
# Requires repository secret CLOUDFLARE_API_TOKEN (same as Pages deploy).
name: Deploy credibility-indexer Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/credibility-indexer/**"
      - "website/functions/api/portal/_lib/passportScore.js"
      - "website/functions/api/portal/_lib/passportVerify.js"
      - "website/functions/api/portal/_lib/quests.js"
      - "website/src/config/passport-rules-v1.json"
      - "website/functions/api/portal/_lib/discordOAuth.js"
      - "website/scripts/discord-sync.test.mjs"
      - ".github/workflows/credibility-indexer-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: workers/credibility-indexer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/credibility-indexer/package-lock.json

      - name: Scoring tests
        run: node --test ../../website/scripts/passport-score.test.mjs ../../website/scripts/discord-sync.test.mjs

      - name: Install and deploy
        run: npm ci && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "10374f367672f4d19db430601db0926b"
