name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    # Run manually from Actions tab to deploy latest main (e.g. if push didn't trigger)

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: cd website && npm ci

      - name: Build
        run: cd website && npm run build
        env:
          # Optional: set PUBLIC_TESTNET_RPC_URL and PUBLIC_BOOTNODES in repo Settings → Secrets and variables → Actions so the faucet and testnet pages show the live endpoints.
          PUBLIC_TESTNET_RPC_URL: ${{ vars.PUBLIC_TESTNET_RPC_URL }}
          PUBLIC_BOOTNODES: ${{ vars.PUBLIC_BOOTNODES }}

      - name: Deploy to Cloudflare Pages
        run: |
          cd website
          for i in 1 2 3; do
            npm exec wrangler -- pages deploy dist --project-name=boing-network && exit 0
            echo "Deploy attempt $i failed (e.g. 504). Retrying in 30s..."
            sleep 30
          done
          echo "Deploy failed after 3 attempts."
          exit 1
        env:
          # Only CLOUDFLARE_API_TOKEN is required (Settings → Secrets → Actions). Account ID is set here so no secret needed.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "10374f367672f4d19db430601db0926b"
