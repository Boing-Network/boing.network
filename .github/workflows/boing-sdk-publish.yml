# Publish @boing-network/boing-sdk to the public npm registry (no interactive OTP).
#
# Trigger: push tag matching boing-sdk/v* (e.g. boing-sdk/v0.5.24), or workflow_dispatch.
# Secret: NPM_TOKEN — npm Automation or granular publish token for the
# @boing-network org (npm user that owns the org packages). Automation tokens
# do not require OTP per publish. The token must be set as a *repository* secret
# named NPM_TOKEN (Settings → Secrets and variables → Actions). An empty or
# missing secret produces ENEEDAUTH on `npm publish`.
#
# Unscoped `boing-sdk` remains owned by locked account `boing.network` — this workflow
# publishes the scoped package only.
#
# Operator steps: see boing-sdk/README.md § Publish to npm (CI).
name: Publish boing-sdk

on:
  push:
    tags:
      - "boing-sdk/v*"
  workflow_dispatch:
    inputs:
      auth_only:
        description: "Only verify NPM_TOKEN auth (npm whoami); do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boing-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: boing-sdk/package-lock.json
          scope: "@boing-network"

      - name: Verify NPM_TOKEN is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Repository secret NPM_TOKEN is missing or empty."
            echo "::error::Set Settings → Secrets and variables → Actions → NPM_TOKEN to an npm Automation (or granular publish) token for @boing-network/boing-sdk."
            echo "::error::Without it, npm publish fails with ENEEDAUTH."
            exit 1
          fi
          WHOAMI="$(npm whoami --registry https://registry.npmjs.org/)"
          echo "npm whoami=${WHOAMI}"
          if [ -z "${WHOAMI}" ]; then
            echo "::error::npm whoami returned empty — NPM_TOKEN may be revoked or lack registry access."
            exit 1
          fi

      - name: Auth-only mode (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.auth_only == true || inputs.auth_only == 'true') }}
        run: echo "NPM_TOKEN auth verified; skipping publish (auth_only=true)."

      - name: Install dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.auth_only != true && inputs.auth_only != 'true') }}
        run: npm ci

      - name: Verify package name and tag matches package.json version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "require('./package.json').name")"
          TAG_VERSION="${GITHUB_REF_NAME#boing-sdk/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "package=${PKG_NAME} tag=${GITHUB_REF_NAME} tag_version=${TAG_VERSION} package.json=${PKG_VERSION}"
          if [ "$PKG_NAME" != "@boing-network/boing-sdk" ]; then
            echo "::error::Expected package name @boing-network/boing-sdk, got ${PKG_NAME}"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version (${TAG_VERSION}) must match boing-sdk/package.json (${PKG_VERSION})"
            exit 1
          fi

      - name: Skip if version already on npm
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.auth_only != true && inputs.auth_only != 'true') }}
        id: already
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@boing-network/boing-sdk@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "@boing-network/boing-sdk@${PKG_VERSION} is already on the registry; skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.auth_only != true && inputs.auth_only != 'true')) && steps.already.outputs.already != 'true' }}
        run: npm run build

      - name: Verify committed dist/ matches TypeScript output
        if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.auth_only != true && inputs.auth_only != 'true')) && steps.already.outputs.already != 'true' }}
        run: |
          set -euo pipefail
          cd ..
          git diff --exit-code -- boing-sdk/dist/ || {
            echo "::error::boing-sdk dist/ is out of sync with src/. Run: cd boing-sdk && npm run build && git add dist && git commit"
            exit 1
          }

      - name: Test
        if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.auth_only != true && inputs.auth_only != 'true')) && steps.already.outputs.already != 'true' }}
        run: npm test

      - name: Publish to npm
        if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.auth_only != true && inputs.auth_only != 'true')) && steps.already.outputs.already != 'true' }}
        run: npm publish --access public
        env:
          # setup-node writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
