name: boing-sdk

on:
  push:
    branches: [main]
    paths:
      - "boing-sdk/**"
      - "examples/native-boing-tutorial/**"
      - ".github/workflows/boing-sdk.yml"
      - "scripts/public-rpc-edge.mjs"
      - "scripts/compute-activation-height.mjs"
      - "scripts/lib/**"
      - "ops/cloudflare/**"
      - "workers/public-rpc-gateway/**"
      - "crates/boing-node/src/rpc.rs"
      - "crates/boing-node/schemas/developer_api.json"
      - "docs/chain-metadata.json"
      - "docs/RPC-API-SPEC.md"
      - "docs/ENVIRONMENT-VARIABLES.md"
  pull_request:
    paths:
      - "boing-sdk/**"
      - "examples/native-boing-tutorial/**"
      - ".github/workflows/boing-sdk.yml"
      - "scripts/public-rpc-edge.mjs"
      - "scripts/compute-activation-height.mjs"
      - "scripts/lib/**"
      - "ops/cloudflare/**"
      - "workers/public-rpc-gateway/**"
      - "crates/boing-node/src/rpc.rs"
      - "crates/boing-node/schemas/developer_api.json"
      - "docs/chain-metadata.json"
      - "docs/RPC-API-SPEC.md"
      - "docs/ENVIRONMENT-VARIABLES.md"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boing-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: boing-sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify committed dist/ matches TypeScript output
        run: |
          cd ..
          git diff --exit-code -- boing-sdk/dist/ || {
            echo "::error::boing-sdk dist/ is out of sync with src/. Run: cd boing-sdk && npm run build && git add dist && git commit"
            exit 1
          }

      - name: Test
        run: npm test

  gateway-worker:
    name: public-rpc-gateway (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/public-rpc-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/public-rpc-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
