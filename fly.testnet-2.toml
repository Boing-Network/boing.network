# Companion Fly.io node for public testnet (optional — costs money when deployed).
# Default role: syncing full node (BOING_VALIDATOR=0). Not HA by itself.
# Promote to a second validator only via docs/SECOND-VALIDATOR-RUNBOOK.md Path B/C
# (shared BOING_VALIDATORS + BOING_VALIDATOR_KEY). Do not claim BFT until n >= 4.
#
# Deploy (explicit; not part of default single-node script):
#   FLY_APP_2=boing-testnet-2 FLY_CONFIG_2=fly.testnet-2.toml ./scripts/fly-deploy-testnet.sh
#   # or: fly deploy --config fly.testnet-2.toml --remote-only --ha=false
#
# Former companion was retired 2026-10-24; this file is the recreate template.

app = "boing-testnet-2"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"

# Secrets (set with `fly secrets set`, never in this file):
#   BOING_OPERATOR_RPC_TOKEN
#   BOING_ORIGIN_GATE_TOKEN   (if this origin is reachable; pair with Worker / Access)
#   BOING_VALIDATOR_KEY       (only when promoting to Path B/C validator)
#   BOING_VALIDATORS          (comma-separated ids — must match every consensus node)

[env]
  RUST_LOG = "info"
  BOING_CHAIN_ID = "6913"
  BOING_CHAIN_NAME = "Boing Testnet"
  BOING_CHAIN_DISPLAY_NAME = "Boing Testnet"
  BOING_EXPLORER_URL = "https://boing.observer"
  BOING_FAUCET_URL = "https://boing.network/faucet"
  BOING_DATA_DIR = "/data"
  BOING_P2P_LISTEN = "/ip4/0.0.0.0/tcp/4001,/ip6/::/tcp/4001"
  # Peer primary over 6PN (re-resolved on redial). Also set BOING_BOOTNODES secret to
  # testnet-1 public multiaddr when joining from outside the org network.
  BOING_EXTRA_BOOTNODES = "/dns6/boing-testnet-1.internal/tcp/4001"
  BOING_RPC_PORT = "8545"
  # 0 = full node / sync soak (Path A). Set to 1 only with shared BOING_VALIDATORS (Path B/C).
  BOING_VALIDATOR = "0"
  BOING_FAUCET_ENABLE = "0"
  BOING_RATE_PROFILE = "mainnet"
  BOING_ALLOW_STUB_VRF = "0"
  BOING_BLOB_GET_REQUIRE_AUTH = "1"
  # Keep consensus gates aligned with fly.testnet-1.toml / live tip.
  BOING_NAME_REGISTRY_ACTIVATION_HEIGHT = "640"
  BOING_STORAGE_TREE_V2_ACTIVATION_HEIGHT = "1500"
  BOING_DEX_TOKEN_METADATA_SCAN_BLOCKS = "8192"
  BOING_DEX_DISCOVERY_MAX_RECEIPT_SCANS = "500000"
  BOING_DEX_TOKEN_DECIMALS_JSON = '{"0x6676f971ade3982406efa3e2cdb0477923f8f2a15624c4b6ad3a432817a75e93":0,"0x6fce9d3e3f13df9fc17e3fd947148a4e6ce6966538b7dd9bf2a891d3b9699c6b":0}'
  BOING_RPC_CORS_EXTRA_ORIGINS = "https://boing.network,https://www.boing.network,https://boing.observer,https://boing.express,https://boing.finance"
  # M6 product gates — leave unset (never) until Nico decides:
  # BOING_VM_BLAKE3_OPCODE_ACTIVATION_HEIGHT =
  # BOING_GOVERNANCE_CONSENSUS_TX_ACTIVATION_HEIGHT =

[http_service]
  internal_port = 8545
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "45s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/live"

[[services]]
  protocol = "tcp"
  internal_port = 4001
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.ports]]
    port = 4001

[mounts]
  source = "boing_data"
  destination = "/data"

[[vm]]
  # Cheaper companion than testnet-1; bump memory if sync OOMs on large PutBlob blocks.
  size = "shared-cpu-1x"
  memory = "1024mb"
