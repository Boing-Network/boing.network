# Primary Fly.io node: validator + faucet + public JSON-RPC.
# Must live at repo root so Docker build context includes Cargo.toml + crates/.
# Deploy: fly deploy --config fly.testnet-1.toml --remote-only --ha=false
# See docs/FLY-IO.md

app = "boing-testnet-1"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"

# Secrets (set with `fly secrets set`, never in this file):
#   BOING_OPERATOR_RPC_TOKEN  operator RPC auth (fail-closed: operator methods return -32057 without it).
#   fly secrets set BOING_OPERATOR_RPC_TOKEN="$(openssl rand -hex 32)" -a <app>

[env]
  RUST_LOG = "info"
  BOING_CHAIN_ID = "6913"
  BOING_CHAIN_NAME = "Boing Testnet"
  # end_user hints in boing_getNetworkInfo (public URLs, not secrets)
  BOING_CHAIN_DISPLAY_NAME = "Boing Testnet"
  BOING_EXPLORER_URL = "https://boing.observer"
  BOING_FAUCET_URL = "https://boing.network/faucet"
  BOING_DATA_DIR = "/data"
  # IPv4 (Fly proxy / public TCP service) + IPv6 (6PN private network; IPv6 listeners are v6-only).
  BOING_P2P_LISTEN = "/ip4/0.0.0.0/tcp/4001,/ip6/::/tcp/4001"
  # boing-testnet-2 retired — no BOING_EXTRA_BOOTNODES (was /dns6/boing-testnet-2.internal/tcp/4001).
  BOING_RPC_PORT = "8545"
  BOING_VALIDATOR = "1"
  BOING_FAUCET_ENABLE = "1"
  BOING_RATE_PROFILE = "dev"
  # Native name registry (.boing): activates at this height on every node (must match across nodes)
  BOING_NAME_REGISTRY_ACTIVATION_HEIGHT = "640"
  # Storage tree v2 (full 256-bit key routing): ONE-WAY activation, must match on every testnet node. Matches the testnet preset (1500, from testnet-v0.1.21); never change once the chain passes it. See docs/STORAGE-TREE-V2-ACTIVATION.md
  BOING_STORAGE_TREE_V2_ACTIVATION_HEIGHT = "1500"
  BOING_DEX_TOKEN_METADATA_SCAN_BLOCKS = "8192"
  BOING_DEX_DISCOVERY_MAX_RECEIPT_SCANS = "500000"
  BOING_DEX_TOKEN_DECIMALS_JSON = '{"0x6676f971ade3982406efa3e2cdb0477923f8f2a15624c4b6ad3a432817a75e93":0,"0x6fce9d3e3f13df9fc17e3fd947148a4e6ce6966538b7dd9bf2a891d3b9699c6b":0}'  # testnet USDC / BOING token v2 are whole-unit
  BOING_RPC_CORS_EXTRA_ORIGINS = "https://boing.network,https://www.boing.network,https://boing.observer,https://boing.express,https://boing.finance"

[http_service]
  internal_port = 8545
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "45s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/live"

[[services]]
  protocol = "tcp"
  internal_port = 4001
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.ports]]
    port = 4001

[mounts]
  source = "boing_data"
  destination = "/data"

[[vm]]
  # performance-2x / 8 GiB (interim cost cut; live machine already 8 GiB).
  # Pin 8192mb in-repo so redeploys do not restore 16 GiB. Watch for OOM (exit 137)
  # if tip blocks serialize multi‑hundred‑MiB getBlockByHeight JSON.
  size = "performance-2x"
  memory = "8192mb"
