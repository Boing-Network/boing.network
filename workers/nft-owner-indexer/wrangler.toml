# Durable reference-NFT ownership index (mint_batch / transfer_nft).
# Setup:
#   1. npx wrangler d1 create boing-nft-owner-index
#   2. Paste database_id below
#   3. npm run d1:apply:remote && npm run deploy
name = "boing-nft-owner-indexer"
main = "src/index.ts"
compatibility_date = "2026-03-06"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "NFT_OWNER_DB"
database_name = "boing-nft-owner-index"
# D1: wrangler d1 create boing-nft-owner-index (reused existing database)
database_id = "746604dc-49e5-410e-844a-29edc78d6ef0"
migrations_dir = "migrations"

[triggers]
crons = ["*/2 * * * *"]

[vars]
# Fly origin (same backends as workers/public-rpc-gateway). The public hostname
# https://testnet-rpc.boing.network is WAF-challenged for Worker-origin fetches.
BOING_RPC_URL = "https://boing-testnet-1.fly.dev"
BOING_CHAIN_ID = "boing-testnet"
BOING_MAX_BLOCKS_PER_TICK = "16"
BOING_MAX_CONCURRENT = "4"
BOING_OMIT_MISSING = "1"
BOING_MAX_REORG_REWIND_STEPS = "4096"
# Optional: comma-separated browser origins; omit → Access-Control-Allow-Origin: *
# BOING_CORS_ORIGINS = "https://boing.express,https://boing.observer"
# BOING_APP_VERSION = "0.1.0"
# BOING_DISABLE_REORG_REWIND = "0"
# Backfill start height when cursor is empty (inclusive). Default 0.
# BOING_BACKFILL_FROM_HEIGHT = "0"
