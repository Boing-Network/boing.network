# Durable reference-NFT ownership index (mint_batch / transfer_nft).
# Setup:
#   1. npx wrangler d1 create boing-nft-owner-index
#   2. Paste database_id below
#   3. npm run d1:apply:remote && npm run deploy
name = "boing-nft-owner-indexer"
main = "src/index.ts"
compatibility_date = "2026-03-06"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "NFT_OWNER_DB"
database_name = "boing-nft-owner-index"
# D1: wrangler d1 create boing-nft-owner-index (reused existing database)
database_id = "746604dc-49e5-410e-844a-29edc78d6ef0"
migrations_dir = "migrations"

[triggers]
crons = ["*/2 * * * *"]

[vars]
# Public RPC hostname (same as native-dex-indexer). The direct Fly origin now requires
# X-Boing-Origin-Gate (2026-11-08), which this Worker does not hold, so fly.dev returns 401.
BOING_RPC_URL = "https://testnet-rpc.boing.network"
BOING_CHAIN_ID = "boing-testnet"
# Blocks are fetched in JSON-RPC batches of 32 (one subrequest each), so 128 blocks = 4 fetches + ~3 tip/reorg
# calls, far under the Free-plan 50-subrequest cap; event-less blocks are written in chunked D1 batches.
# Chain makes ~17 blocks per 2-minute tick, so the old 16 could never catch up.
BOING_MAX_BLOCKS_PER_TICK = "128"
BOING_RPC_BATCH_SIZE = "32"
BOING_MAX_CONCURRENT = "4"
BOING_OMIT_MISSING = "1"
BOING_MAX_REORG_REWIND_STEPS = "4096"
# Multi-token items index (request-driven, no cron): first height scanned on a cold cursor.
BOING_ITEMS_FROM_HEIGHT = "37540"
BOING_ITEMS_MAX_BLOCKS_PER_REQUEST = "16"
BOING_ITEMS_MIN_INTERVAL_SEC = "10"
# Optional: comma-separated browser origins; omit → Access-Control-Allow-Origin: *
# BOING_CORS_ORIGINS = "https://boing.express,https://boing.observer"
# BOING_APP_VERSION = "0.1.0"
# BOING_DISABLE_REORG_REWIND = "0"
# Backfill start height when cursor is empty (inclusive). Default 0.
# BOING_BACKFILL_FROM_HEIGHT = "0"
