# Public testnet JSON-RPC edge: https://testnet-rpc.boing.network/
# Failover proxy in front of the Fly.io cluster. See README.md and docs/FLY-IO.md.
name = "boing-public-rpc-gateway"
main = "src/index.ts"
compatibility_date = "2026-03-06"
workers_dev = true

[[routes]]
pattern = "testnet-rpc.boing.network/*"
zone_name = "boing.network"

[vars]
# Single hosted backend: boing-testnet-2 retired 2026-10-24.
RPC_BACKENDS = "https://boing-testnet-1.fly.dev"
# Method allow-list + per-IP class limits (src/edgePolicy.ts): "log" = observe only, "enforce" = reject, "off".
# Enforcing since 2026-10-28 after two days of log mode (5 of 35,796 requests would have been denied, all unknown methods). Rollback: set "log" or "off" and redeploy, or `wrangler rollback`. Optional secret: EDGE_TRUSTED_TOKEN.
EDGE_POLICY_MODE = "enforce"

# Workers Logs: persisted, queryable in the dashboard (Workers & Pages > boing-public-rpc-gateway > Logs) and via the telemetry API.
[observability]
enabled = true
head_sampling_rate = 1

# BEGIN GENERATED public-rpc-policy (scripts/public-rpc-edge.mjs generate; do not edit)
[[ratelimits]]
name = "RL_READ"
namespace_id = "691301"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RL_HEAVY"
namespace_id = "691302"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_SUBMIT"
namespace_id = "691303"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "691304"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_FAUCET"
namespace_id = "691305"
simple = { limit = 3, period = 60 }
# END GENERATED public-rpc-policy
