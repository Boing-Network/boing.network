# Testnet Passport credibility indexer (stage 2). See ../../docs/TESTNET-PASSPORT.md
# Every 15 minutes (kicked via service binding from boing-native-dex-indexer's */15 cron, because the account is at
# the Workers Free cap of 5 cron triggers): samples validator uptime, refreshes stale registered accounts (signals -> badges -> tiers),
# prunes old samples, and writes one weekly snapshot with a Merkle root. Writes to D1 boing-network-db.
# Free plan: <=45 RPC subrequests/tick, ~10-30 D1 row writes/tick (~4k/day).
name = "boing-credibility-indexer"
main = "src/index.js"
compatibility_date = "2026-03-06"
# Not publicly routable: only reachable through the service binding.
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "boing-network-db"
database_id = "8cafc32c-5d92-42f3-8c4e-5277b20006c5"

[observability]
enabled = true

[triggers]
crons = []

[vars]
RPC_URL = "https://testnet-rpc.boing.network/"
# Accounts refreshed per tick (stale-first) and the account refresh interval.
ACCOUNTS_PER_TICK = "4"
REFRESH_MINUTES = "60"
# Total boing_getAccountTransactions pages per tick (each page = 1 subrequest, 100 txs).
PAGE_BUDGET = "36"
UPTIME_RETENTION_DAYS = "30"
